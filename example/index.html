<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="images/1x1-00000000.png" />
        <title>Invisible Ink Demo</title>
        <style>
            body {
                background: #000;
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }

            a {
                background-color: #d4d4d4;
                color: #000;
                font-size: 23px;
                height: 50px;
                line-height: 50px;
                margin: 0;
                position: absolute;
                text-align: center;
                text-decoration: none;
                text-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
                width: 50%;
            }

            a + a {
                background-color: rgb(132 190 204);
                right: 0;
            }

            iframe {
                background: #fff;
                border: none;
                height: calc(100% - 50px);
                position: absolute;
                width: 50%;
                top: 50px;
            }

            iframe + iframe {
                right: 0;
            }

            /* Vertical line between the two halves */
            body::before {
                background-color: #000;
                bottom: 0;
                content: "";
                height: 100%;
                left: 50%;
                position: fixed;
                top: 0;
                width: 1px;
                z-index: 9999;
            }
        </style>
    </head>
    <body>
        <!-- Files linked below were automatically generated (by `make examples`) -->
        <a href="example-conventional.html">Conventional</a>
        <a href="example-gradual.html">Gradual</a>
        <!-- <a href="example-hollow.html">Hollow Glyphs</a> -->
        <!-- <a href="example-solid.html">Solid Blocks</a> -->
        <iframe src="example-conventional.html"></iframe>
        <iframe src="example-gradual.html"></iframe>
        <!-- <iframe src="example-hollow.html"></iframe> -->
        <!-- <iframe src="example-solid.html"></iframe> -->
    </body>
</html>
